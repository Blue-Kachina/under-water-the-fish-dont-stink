; Nature mode's tuning (applied on entering Nature, put back on leaving it):
; Extra Swishy strides, no boost, water drag and neutral buoyancy for open
; water, the bow wave, and the arcade camera. Throttle alone is a calm cruise
; (forward_accel / linear_drag, about 9.4 m/s); real speed comes from
; well-timed strides, which bleed off again through the drag when you stop.
; Only the differences from the defaults are listed (the user's tuning,
; 2026-10-15).

[preset]

description="Nature: Extra Swishy strides, no boost, open-water drag"

[fish]

boost_enabled=false
swim_strokes=true
swim_style=1
forward_accel=8.0
reverse_accel=10.0
brake_accel=20.0
max_speed=12.0
max_reverse_speed=5.0
max_boost_speed=60.0
linear_drag=0.85
overspeed_drag=0.59
lateral_drag=1.0
angular_drag=1.0
buoyancy=0.0
wall_bounce=0.25
stride_fade_time=0.35
stride_fresh=0.35
stride_flow_max=1.9
stride_steer_smoothing=0.0
stride_tail_swing=1.0
stride_tail_growth=2.6
bow_wave=true
bow_full_speed=35.0
bow_length=1.5
bow_girth=4.0
nature_demo_speed=10.0

[camera]

arcade_zoom=0.095
arcade_punch=0.0
