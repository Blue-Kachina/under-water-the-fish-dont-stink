; Nature mode's tuning (applied on entering Nature, put back on leaving it):
; Extra Swishy strides, no boost, water drag and neutral buoyancy for open
; water. Throttle alone is a calm cruise (max_speed); real speed comes from
; well-timed strides, which bleed off again through the drag when you stop.
; Only the fish's differences from the defaults are listed. nature_demo_speed is
; below the throttle cruise (max_speed) for now, by choice: the target is practice.

[preset]

description="Nature: Extra Swishy strides, no boost, open-water drag"

[fish]

boost_enabled=false
swim_strokes=true
swim_style=1
forward_accel=8.0
reverse_accel=10.0
brake_accel=20.0
max_speed=12.0
max_reverse_speed=5.0
max_boost_speed=60.0
linear_drag=0.35
overspeed_drag=0.6
lateral_drag=1.0
angular_drag=1.0
buoyancy=0.0
stride_fade_time=0.35
stride_fresh=0.35
stride_steer_smoothing=0.25
nature_demo_speed=10.0
bow_wave=true
