[profile]
name="Homemade Sounds"
author="Blue Kachina"
description="Every sound is made from our voices, or instruments we already had."
underwater_filter=false      ; false = play exactly as recorded (you baked the effect in)
root_note="D"               ; for pitched events
scale="chromatic"    ; major, minor, major_pentatonic, minor_pentatonic, chromatic, ...

[mix]                       ; per-event trims, so you can mix without touching code
"ui/move" =                 { "volume_db": -12.0, "pitch_jitter": 0.05 }
"ui/select" =               { "volume_db": -12.0, "pitch_jitter": 0.05 }
"ui/back" =                 { "volume_db": -12.0, "pitch_jitter": 0.05 }
"ui/denied" =               { "volume_db": -12.0, "pitch_jitter": 0.05 }

"ball/hit" =                { "volume_db": -2.0, "pitch_jitter": 0.05 }

"fish/boost_loop" =         { "volume_db": -6.0 }

"unnatural/zombie_die" =    { "volume_db": -9.0, "max_voices": 6 }

"unnatural/sting_fire" =   { "volume_db": -18.0,  "max_voices": 6 }
"unnatural/bite_fire" =     { "volume_db": -9.0,  "max_voices": 6 }
"unnatural/lash_fire" =     { "volume_db": -9.0,  "max_voices": 6 }
"unnatural/thrust_fire" =   { "volume_db": -9.0,  "max_voices": 6 }
"unnatural/bubbles_fire" =  { "volume_db": -9.0,  "max_voices": 6 }
"unnatural/spines_fire" =   { "volume_db": -9.0,  "max_voices": 6 }